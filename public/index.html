<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG ⚡ FVD — OLLAMA CHAT</title>
<style>
  :root {
    --bg: #0a0a0f;
    --pink: #ff2d78;
    --lime: #a3ff12;
    --yellow: #ffe600;
    --panel: #12121a;
    --mono: "Courier New", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #e8e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 20px;
    border-bottom: 3px solid var(--pink);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: linear-gradient(90deg, #0a0a0f 0%, #160a14 100%);
  }
  header h1 {
    font-family: var(--mono);
    font-size: 1.15rem;
    letter-spacing: 1px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--pink);
  }
  select, button, textarea, input {
    font-family: var(--mono);
    font-size: 0.9rem;
  }
  select {
    background: var(--panel);
    color: var(--lime);
    border: 2px solid var(--lime);
    padding: 6px 10px;
    cursor: pointer;
  }
  #offline-banner {
    display: none;
    background: #3a0a12;
    color: #ff6b8f;
    border: 2px dashed var(--pink);
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 0.85rem;
    margin: 8px 16px 0;
  }
  .btn {
    background: var(--panel);
    border: 2px solid var(--pink);
    color: var(--pink);
    padding: 6px 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
  }
  .btn:hover { background: var(--pink); color: #0a0a0f; }
  .btn.lime { border-color: var(--lime); color: var(--lime); }
  .btn.lime:hover { background: var(--lime); color: #0a0a0f; }
  .btn.yellow { border-color: var(--yellow); color: var(--yellow); }
  .btn.yellow:hover { background: var(--yellow); color: #0a0a0f; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 220px;
    border-right: 2px solid #222233;
    padding: 12px;
    overflow-y: auto;
    background: #0d0d14;
  }
  aside h2 {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--pink);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .conv-item {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid #2a2a3a;
    cursor: pointer;
    color: #aaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .conv-item:hover { border-color: var(--lime); color: var(--lime); }
  .conv-item.active { border-color: var(--pink); color: var(--yellow); }
  .conv-item .del { color: var(--pink); cursor: pointer; padding-left: 6px; }
  #chat-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    line-height: 1.5;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--pink);
    color: #0a0a0f;
    font-weight: 600;
    transform: rotate(0.4deg);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 2px solid var(--lime);
    color: #d8ffd8;
    transform: rotate(-0.3deg);
  }
  .msg .who {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 2px;
    opacity: 0.6;
    display: block;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  #empty-hint {
    margin: auto;
    font-family: var(--mono);
    color: #444;
    text-align: center;
    font-size: 0.9rem;
  }
  #empty-hint b { color: var(--yellow); }
  #input-bar {
    border-top: 3px solid var(--lime);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    background: #0d0d14;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 2px solid #33334a;
    color: var(--yellow);
    padding: 10px;
    resize: none;
    min-height: 44px;
    max-height: 160px;
  }
  #input:focus { outline: none; border-color: var(--yellow); }
  #send-btn { align-self: flex-end; }
  #stop-btn { align-self: flex-end; display: none; }
  .cursor { color: var(--lime); animation: blink 0.8s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 720px) {
    aside { display: none; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <h1>AG ⚡ FVD — OLLAMA CHAT</h1>
  <select id="model-select"><option value="">loading models…</option></select>
  <button class="btn lime" id="new-btn">+ Nouvelle conversation</button>
</header>

<div id="offline-banner">🦙 Ollama offline — run <code>ollama serve</code></div>

<main>
  <aside>
    <h2>// conversations</h2>
    <div id="conv-list"></div>
  </aside>
  <div id="chat-wrap">
    <div id="chat"></div>
    <div id="input-bar">
      <textarea id="input" rows="1" placeholder="Tape ton message… (Enter = envoyer, Shift+Enter = newline)"></textarea>
      <button class="btn yellow" id="send-btn">Send ⚡</button>
      <button class="btn" id="stop-btn">Stop ■</button>
    </div>
  </div>
</main>

<script>
'use strict';

const LS_KEY = 'ollama-chat-v1';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const newBtn = document.getElementById('new-btn');
const modelSelect = document.getElementById('model-select');
const offlineBanner = document.getElementById('offline-banner');
const convListEl = document.getElementById('conv-list');

let conversations = load();
let currentId = conversations[0] ? conversations[0].id : null;
let abortController = null;
let streaming = false;

if (!currentId) newConversation();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    const data = raw ? JSON.parse(raw) : [];
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(conversations)); } catch {}
}
function current() { return conversations.find(c => c.id === currentId); }

function newConversation() {
  const conv = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title: 'Nouvelle conversation', messages: [] };
  conversations.unshift(conv);
  currentId = conv.id;
  save();
  renderAll();
}

function deleteConversation(id, ev) {
  ev.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  if (currentId === id) {
    if (conversations[0]) currentId = conversations[0].id;
    else { newConversation(); return; }
  }
  save();
  renderAll();
}

function renderAll() {
  renderSidebar();
  renderChat();
}

function renderSidebar() {
  convListEl.innerHTML = '';
  conversations.forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentId ? ' active' : '');
    const span = document.createElement('span');
    span.textContent = c.title || 'Nouvelle conversation';
    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '✕';
    del.addEventListener('click', (ev) => deleteConversation(c.id, ev));
    div.appendChild(span);
    div.appendChild(del);
    div.addEventListener('click', () => { if (!streaming) { currentId = c.id; renderAll(); } });
    convListEl.appendChild(div);
  });
}

function renderChat() {
  chatEl.innerHTML = '';
  const conv = current();
  if (!conv || conv.messages.length === 0) {
    const hint = document.createElement('div');
    hint.id = 'empty-hint';
    hint.innerHTML = '⚡ <b>ALLIANCE GAGNANTE</b> ⚡<br>Francis Végiard Dev<br><br>Pick a model. Talk to your local LLM.<br>No cloud. No API keys. <b>No gods, no masters.</b>';
    chatEl.appendChild(hint);
    return;
  }
  conv.messages.forEach(m => chatEl.appendChild(makeBubble(m.role, m.content)));
  scrollBottom();
}

function makeBubble(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = role === 'user' ? '☠ you' : '🦙 ' + (modelSelect.value || 'ollama');
  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = content;
  div.appendChild(who);
  div.appendChild(body);
  return div;
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

async function refreshModels() {
  try {
    const r = await fetch('/api/models');
    const data = await r.json();
    offlineBanner.style.display = data.online ? 'none' : 'block';
    const prev = modelSelect.value;
    modelSelect.innerHTML = '';
    if (data.online && data.models.length) {
      data.models.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        modelSelect.appendChild(opt);
      });
      if (data.models.includes(prev)) modelSelect.value = prev;
    } else {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = data.online ? '(no models — ollama pull one)' : '(offline)';
      modelSelect.appendChild(opt);
    }
  } catch {
    offlineBanner.style.display = 'block';
  }
}

function setStreaming(on) {
  streaming = on;
  sendBtn.style.display = on ? 'none' : 'inline-block';
  stopBtn.style.display = on ? 'inline-block' : 'none';
  inputEl.disabled = on;
}

async function send() {
  if (streaming) return;
  const text = inputEl.value.trim();
  const model = modelSelect.value;
  if (!text || !model) return;

  const conv = current();
  conv.messages.push({ role: 'user', content: text });
  if (conv.title === 'Nouvelle conversation') {
    conv.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
  }
  inputEl.value = '';
  inputEl.style.height = 'auto';

  chatEl.querySelector('#empty-hint')?.remove();
  chatEl.appendChild(makeBubble('user', text));
  const bubble = makeBubble('assistant', '');
  const body = bubble.querySelector('.body');
  chatEl.appendChild(bubble);
  scrollBottom();

  abortController = new AbortController();
  setStreaming(true);
  let acc = '';

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: conv.messages }),
      signal: abortController.signal,
    });
    if (!r.ok) {
      let errMsg = 'HTTP ' + r.status;
      try { errMsg = (await r.json()).error || errMsg; } catch {}
      throw new Error(errMsg);
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) !== -1) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;
        try {
          const obj = JSON.parse(line);
          if (obj.message && obj.message.content) {
            acc += obj.message.content;
            body.textContent = acc;
            scrollBottom();
          }
          if (obj.error) throw new Error(obj.error);
        } catch (e) {
          if (e instanceof SyntaxError) continue;
          throw e;
        }
      }
    }
    conv.messages.push({ role: 'assistant', content: acc });
    save();
  } catch (err) {
    if (err.name === 'AbortError') {
      acc += ' [stopped ■]';
      body.textContent = acc;
      if (acc.trim()) {
        conv.messages.push({ role: 'assistant', content: acc });
        save();
      }
    } else {
      body.textContent = '💥 ' + err.message;
    }
  } finally {
    setStreaming(false);
    abortController = null;
    renderSidebar();
  }
}

sendBtn.addEventListener('click', send);
stopBtn.addEventListener('click', () => { if (abortController) abortController.abort(); });
newBtn.addEventListener('click', () => { if (!streaming) newConversation(); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

renderAll();
refreshModels();
setInterval(refreshModels, 15000);
</script>
</body>
</html>
